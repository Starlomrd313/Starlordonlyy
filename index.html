function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function decrypt(password){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(SALT),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(IV)},key,fromB64(ENCRYPTED));
 return new TextDecoder().decode(plain);
}
